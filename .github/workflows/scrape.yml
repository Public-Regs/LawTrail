name: Scrape peraturan

on:
  schedule:
    - cron: "17 2 * * *" # 09:17 WIB setiap hari
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: scripts
        run: pip install -r requirements.txt

      - name: Run scraper
        working-directory: scripts
        run: python run_scrape.py

      - name: Commit and push if there are changes
        run: |
          git config user.name "lawtrail-bot"
          git config user.email "hiramaulana@users.noreply.github.com"
          git add data/ raw/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "chore: scrape otomatis $(date -u +%Y-%m-%d)"
            git push
          fi
